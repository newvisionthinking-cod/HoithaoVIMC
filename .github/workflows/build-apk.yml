name: Tự Động Tạo File APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Cài đặt môi trường Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Cài đặt Capacitor và tạo dự án Android
        run: |
          npm install
          npx cap init "Hội Thao VIMC" com.hoithao.vimc --web-dir .
          npx cap add android
          npx cap copy android

      - name: 5. Biên dịch file APK bằng Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Xuất bản file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: HoiThao-VIMC-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
