name: Build APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Chuẩn bị thư mục web và cấu hình
        run: |
          mkdir -p www
          cp index.html www/
          npm install
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.hoithao.vimc",
            "appName": "Hội Thao VIMC",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: 5. Biên dịch file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 6. Tải file APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoiThao-VIMC-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
