name: Tự Động Tạo File APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Cài đặt thư viện & Tạo cấu hình Capacitor
        run: |
          npm install
          # Tạo trước file cấu hình để Capacitor không đòi hỏi tương tác thủ công
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.hoithao.vimc",
            "appName": "Hội Thao VIMC",
            "webDir": "."
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: 5. Cấp quyền & Biên dịch file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. Xuất bản file APK tải về
        uses: actions/upload-artifact@v4
        with:
          name: HoiThao-VIMC-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
